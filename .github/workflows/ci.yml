name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Run API tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-32-characters-minimum
          IMAGEKIT_PRIVATE_KEY: ci-test-imagekit-key
          MONGOMS_STARTUP_TIMEOUT: "120000"
      - name: Syntax check
        run: find . -path ./node_modules -prune -o -name "*.js" -print0 | xargs -0 -n1 node --check

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
